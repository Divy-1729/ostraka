[project]
name = "ostraka"
version = "0.1.0"
description = "A local-first paper reader, visual study guide and presentation studio. Bring your own model key."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pypdf>=5,<7", "python-multipart>=0.0.20,<1", "beautifulsoup4>=4.12,<5", "nh3>=0.3,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[project.scripts]
ostraka = "ostraka.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ostraka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
